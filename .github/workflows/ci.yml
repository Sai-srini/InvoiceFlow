name: ci
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Start a real MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:6 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "1" && break || sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          sleep 5
      - name: Integration tests with REAL transactions
        run: npm run test:integration
        env:
          TEST_REAL_TXN: "1"
          TEST_MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run build
